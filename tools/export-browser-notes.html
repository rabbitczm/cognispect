<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>知镜 · 旧版笔记迁移</title><style>body{max-width:850px;margin:60px auto;padding:24px;font:16px/1.9 system-ui;color:#234337;background:#f6f9f7}textarea{width:100%;min-height:240px;box-sizing:border-box;padding:18px;border:1px solid #bfd1c7;border-radius:10px}button{padding:10px 20px;background:#256b5c;color:white;border:0;border-radius:8px;cursor:pointer}h1{font-size:28px}</style><h1>旧版笔记迁移到知镜</h1><p>在保存过笔记的原浏览器打开旧工作台，按 F12 打开控制台。复制下面的导出代码，粘贴执行后，会下载该工作台的笔记、收藏和复盘备份。</p><textarea id="code" readonly></textarea><p><button id="copy">复制导出代码</button> <span id="status"></span></p><p>回到知镜网站，登录你的账号，在“我的工作区 → 导入旧版备份”选择下载的文件。</p><script>
const code=`(()=>{const keys=['helix.notes.v9','helix.reviews.v16','helix.review.v12','helix.review.active.v16','helix.clips.v2','helix.clip.v1','helix.api.v14'];const data={};for(const k of Object.keys(localStorage)){if(keys.includes(k)||k.startsWith('helix.translation.')){let value=localStorage.getItem(k);if(k==='helix.api.v14'){const config=JSON.parse(value);delete config.key;delete config.fallbackKey;value=JSON.stringify(config);}data[k]=value;}}const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({format:'helix-workspace-v17',data},null,2)],{type:'application/json'}));a.href=u;a.download='知镜-旧版笔记备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);})();`;
document.getElementById('code').value=code;document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(code);document.getElementById('status').textContent='已复制';};
</script></html>
