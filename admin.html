<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知镜 管理后台</title><link rel="stylesheet" href="/assets/admin.css">
<style>
:root{color-scheme:light;--ink:#193c35;--sub:#627871;--line:#d5e2dd;--accent:#286f5e}*{box-sizing:border-box}body{margin:0;background:#eef3f0;color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}a{color:var(--accent)}header{display:flex;justify-content:space-between;align-items:center;padding:20px 32px;border-bottom:1px solid var(--line);background:#ffffffb8;backdrop-filter:blur(18px)}header strong{font-size:22px;letter-spacing:-.6px}header span{margin-left:12px;color:var(--sub);font-size:12px}header div{display:flex;align-items:center;gap:18px}main{max-width:1480px;margin:32px auto;padding:0 30px}.surface{background:#ffffffd9;border:1px solid var(--line);border-radius:18px;box-shadow:inset 0 1px #fff,0 18px 48px #12392c08;padding:26px}h1{font-size:28px;letter-spacing:-1px;margin:0 0 6px}h2{font-size:17px;margin:0 0 15px}p{color:var(--sub)}label{display:grid;gap:7px;margin:15px 0;color:var(--sub);font-size:12px}input,select,textarea{min-width:0;border:1px solid #b9cec4;border-radius:8px;padding:9px 11px;background:#f6f9f7;color:var(--ink)}button{border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:white;padding:9px 15px}button.secondary{background:transparent;color:var(--accent);border-color:var(--line)}button:active{transform:translateY(1px)}.login{max-width:430px;margin:9vh auto}.login button{width:100%;margin-top:15px}.kicker{font:11px ui-monospace,monospace;letter-spacing:.12em;color:var(--accent)}.error{color:#ad3b3b;margin:10px 0}.stats{display:flex;gap:40px;flex-wrap:wrap;margin:26px 0}.stats strong{display:block;font-size:28px;font-weight:600}.stats span{font-size:12px;color:var(--sub)}.filters{display:grid;grid-template-columns:minmax(240px,1fr) 160px 170px auto;gap:12px;align-items:end}.filters label{margin:0}.filters button{height:42px}.table-wrap{overflow:auto;margin-top:20px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;padding:15px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--sub);font-weight:500}td{font-size:12px}.paper{min-width:260px;max-width:430px}.paper b{display:block;font-size:13px;font-weight:550;line-height:1.6}.paper small{color:var(--sub)}td select{width:116px}td textarea{width:220px;min-height:75px;resize:vertical}.pagination{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:18px}.pagination span{margin-right:auto;color:var(--sub);font-size:12px}.badge{padding:3px 7px;background:#f1e8d3;color:#866626;border-radius:5px;font-size:10px}.saved{display:block;color:var(--accent);font-size:11px;padding-top:5px}@media(max-width:750px){header{padding:16px}header span{display:none}header div{gap:12px}main{padding:0 16px}.surface{padding:18px}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}.stats{gap:22px}.stats strong{font-size:24px}.pagination{flex-wrap:wrap}}
</style><link rel="stylesheet" href="/assets/publication-reader.css"></head><body><header><strong>知镜 <span>文献与来源管理</span></strong><div><a href="/">返回工作台</a><button class="secondary" id="logout" hidden>退出登录</button></div></header><main id="app"></main>
<script src="/assets/publication-reader.js"></script><script src="/assets/admin-upgrade.js"></script><script src="/assets/admin-owner.js"></script><script src="/assets/admin.js"></script></body></html>
