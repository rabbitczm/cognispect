<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>知镜 · 从人体开始</title><link rel="stylesheet" href="/assets/upgrade.css?v=18"><style>
:root{--bg:#f7f9f6;--text:#233c32;--line:#d9e2da;--muted:#64796c;--accent:#367860;--accent-soft:#e5eee5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{max-width:1260px;margin:auto;padding:24px 30px;border-bottom:1px solid var(--line);font-weight:650;letter-spacing:.12em}header span{font-size:12px;font-weight:400;letter-spacing:0;margin-left:18px;color:var(--muted)}main{padding:30px;max-width:1320px;margin:auto}h1{font-size:32px;letter-spacing:-.03em;font-weight:600;margin:8px 0}h2{font-weight:550}.work-head p{color:var(--muted);margin:10px 0 26px}.overline{font-size:12px;color:var(--muted);letter-spacing:.08em}.btn{padding:12px 20px;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:white;cursor:pointer;font:inherit;transition:transform .16s,background .16s}.btn:active{transform:scale(.98)}.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}.row{display:flex;gap:10px;flex-wrap:wrap}a{color:var(--accent);text-decoration:none}@media(max-width:767px){main{padding:22px 18px}header{padding:18px}h1{font-size:25px}header span{font-size:11px;margin-left:12px}}
</style></head><body><header>知镜<span>医学研究，从理解人体开始</span></header><main id="main"><p>正在准备人体导览…</p></main><script src="/assets/three.min.js?v=18"></script><script src="/assets/intro-config.js?v=18"></script><script src="/assets/intro-bootstrap.js?v=18"></script><script src="/assets/upgrade.js?v=18"></script><script>(async()=>{try{const q=new URLSearchParams(location.search),response=await fetch('/api/site'+(q.get('preview')==='1'?'?preview=1':'')),site=await response.json();document.title=(site.name||'知镜')+' · 从人体开始';document.querySelector('header').firstChild.textContent=site.name||'知镜';if(site.modules?.some(m=>m.id==='intro'&&m.visible===false)&&q.get('preview')!=='1'){goto('search');return;}document.getElementById('main').innerHTML=UpgradeUI.intro();const h=document.querySelector('.work-head h1'),p=document.querySelector('.work-head p');if(site.hero_title)h.textContent=site.hero_title;if(site.hero_description)p.textContent=site.hero_description;if(site.announcement){const a=document.createElement('p');a.textContent=site.announcement;document.getElementById('main').prepend(a);}UpgradeUI.enhance();}catch(error){document.getElementById('main').innerHTML='<p>人体导览暂未连接，请刷新重试。</p>';}})();</script></body></html>
