<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知镜 | 医学影像文献检索台</title>
<style>
/* ============================================================
   HELIX 设计系统
   原则：学术出版物式的克制。颜色只承担状态语义（通过/警告/失败），
   其余一律灰阶；信息层级靠字号、字重、留白与分隔线，不靠色块堆叠。
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --sans:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Code",monospace;
  --r:3px;
  --r-sm:3px;
  --gut:24px;
  --measure:74ch;
}
[data-theme="light"]{
  --bg:#f3f4f5;
  --surface:#ffffff;
  --surface2:#eceef0;
  --line:#dbdfe2;
  --line2:#b9c0c6;
  --tx:#14171a;
  --tx2:#414850;
  --tx3:#79818a;
  --accent:#1c3f66;
  --accent-2:#12294a;
  --accent-soft:#e8eef5;
  --danger:#8c2f39;
  --warn:#6f5210;
  --ok:#2c6146;
}
[data-theme="dark"]{
  --bg:#101315;
  --surface:#151a1d;
  --surface2:#191f23;
  --line:#262c31;
  --line2:#3b444b;
  --tx:#e8eaec;
  --tx2:#a8b0b7;
  --tx3:#727b83;
  --accent:#89b0d8;
  --accent-2:#a9c9e8;
  --accent-soft:#16222e;
  --danger:#d98b92;
  --warn:#c9a961;
  --ok:#7cba97;
}

html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);
  font:14.5px/1.75 var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  display:flex;flex-direction:column;
}
a{
  color:var(--accent);text-decoration:none;
  border-bottom:1px solid color-mix(in srgb,var(--accent) 34%,transparent);
}
a:hover{border-bottom-color:var(--accent);background:var(--accent-soft)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--tx)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 图标：统一 1.5px 描边、currentColor、永不单独着色 */
.ic{
  width:14px;height:14px;flex:none;
  stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;
}
.btn-ghost{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--tx2);background:transparent;
  border:1px solid var(--line);border-radius:var(--r);
  padding:4px 9px;cursor:pointer;transition:.14s;white-space:nowrap;
}
.btn-ghost:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

/* ---------- 顶栏 ---------- */
header{
  flex:none;display:flex;align-items:center;gap:20px;
  padding:0 var(--gut);height:52px;
  border-bottom:1px solid var(--line2);background:var(--surface);
  position:relative;z-index:20;
}
.brand{display:flex;align-items:baseline;gap:8px;flex:none}
.brand b{font-size:15.5px;font-weight:660;letter-spacing:-.005em}
.brand i{font-style:normal;font-size:11.5px;color:var(--tx3)}

.hb{display:flex;align-items:center;gap:7px;margin-left:auto;flex:none}
/* 状态标记：左侧竖条 + 文字，像检验单的勾栏；不用胶囊与淡色底块 */
.pill{
  font-size:11px;padding:1px 0 1px 8px;border-radius:0;
  border:0;border-left:2px solid var(--line2);background:transparent;
  color:var(--tx2);white-space:nowrap;
}
.pill.ok{color:var(--ok);border-left-color:var(--ok)}
button.pill{cursor:pointer;transition:color .14s;font-family:var(--sans)}
button.pill:hover{color:var(--accent);border-left-color:var(--accent)}
.icon-btn{
  width:28px;height:28px;border-radius:var(--r);cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--tx2);
  display:grid;place-items:center;transition:.14s;
}
.icon-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

/* ---------- 主框架 ---------- */
.shell{flex:1;display:flex;min-height:0;overflow:hidden}

nav{
  width:236px;flex:none;border-right:1px solid var(--line);
  background:var(--surface);overflow-y:auto;padding:16px 12px 40px;
}
.navgrp{
  font-size:10.5px;font-weight:640;color:var(--tx3);
  padding:20px 8px 8px;
}
.navgrp:first-child{padding-top:0}
.step-item{
  display:flex;gap:10px;padding:8px;border-radius:var(--r);cursor:pointer;
  border-left:2px solid transparent;margin-bottom:1px;transition:.14s;
  align-items:flex-start;
}
.step-item:hover{background:var(--surface2)}
.step-item.on{background:var(--accent-soft);border-left-color:var(--accent)}
.step-item .n{
  width:16px;flex:none;color:var(--tx3);margin-top:2px;
  display:flex;align-items:center;justify-content:center;
}
.step-item .n svg{width:15px;height:15px;display:block}
.step-item.on .n{color:var(--accent)}
.step-item .t{font-size:12.5px;font-weight:600;line-height:1.45;color:var(--tx2)}
.step-item.on .t{color:var(--tx)}
.step-item .s{font-size:11px;color:var(--tx3);line-height:1.5;margin-top:1px}

.nav-docs{margin-top:4px}
.doc-line{
  display:flex;gap:8px;padding:5px 8px 5px 10px;border-radius:var(--r);cursor:pointer;
  align-items:baseline;transition:background .14s;
}
.doc-line:hover{background:var(--surface2)}
.doc-line .num{font-size:10.5px;color:var(--tx3);flex:none;width:14px}
.doc-line .nm{font-size:11.5px;color:var(--tx2);line-height:1.5}
.doc-line:hover .nm{color:var(--tx)}
#main .doc-line{
  padding:9px 4px;border-bottom:1px solid var(--line);border-radius:0;
  align-items:flex-start;
}
#main .doc-line:last-child{border-bottom:0}
#main .doc-line .num{color:var(--accent);padding-top:2px}
#main .doc-line .nm{font-size:13px;color:var(--tx2);line-height:1.55}

main{flex:1;overflow-y:auto;padding:30px 40px 100px;min-width:0;scroll-behavior:smooth;transition:padding-right .2s ease}
/* 阅读型页面限宽，工具型页面（检索）放宽——两种版式的宽度需求本来就不同 */
.wrap{max-width:var(--measure);margin:0 auto}
.wrap.wide{max-width:min(1260px,100%)}
/* 抽屉打开时给正文让位，避免遮住右半边 */
@media (min-width:1420px){
  body.ev-open main{padding-right:calc(452px + 40px)}
  body.ev-open aside#ev{box-shadow:none}
}

h2{font-size:23px;font-weight:640;letter-spacing:-.012em;line-height:1.32;text-wrap:balance}
.lede{font-size:14px;color:var(--tx2);margin:8px 0 26px;line-height:1.7;max-width:62ch}

/* 内容块不再各自套盒子：靠上分隔线与留白分组，像记录单而不是卡片流 */
.card{
  background:transparent;border:0;border-radius:0;
  padding:0;margin:0 0 26px;box-shadow:none;
}
.card+.card{border-top:1px solid var(--line);padding-top:22px}
.card.tight{margin-bottom:20px}
.card.tight+.card.tight{padding-top:18px}

h3{
  font-size:14px;font-weight:650;line-height:1.5;color:var(--tx);
  margin:0 0 12px;letter-spacing:-.003em;
}
.tag{
  font-size:10.5px;padding:0;border-radius:0;font-weight:600;
  white-space:nowrap;color:var(--tx3);
}
.tag.info{color:var(--accent)}
.tag.cl{color:var(--tx3);border:0}
.tag.ev{color:var(--tx2);border:0}
.tag::before{content:"[";font-weight:400;color:var(--tx3)}
.tag::after{content:"]";font-weight:400;color:var(--tx3)}
.cite{
  font-size:11px;padding:0;border-radius:0;cursor:pointer;
  background:transparent;color:var(--accent);
  border:0;border-bottom:1px dotted var(--accent);transition:.14s;
  font-family:var(--sans);font-weight:500;
}
.cite:hover{background:var(--accent-soft)}

/* ---------- 表格 ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{
  text-align:left;font-size:11.5px;font-weight:640;
  color:var(--tx3);
  padding:0 12px 7px 0;border-bottom:1px solid var(--line2);
}
table.tbl td{
  padding:9px 10px 9px 0;border-bottom:1px solid var(--line);
  vertical-align:top;line-height:1.6;
}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td.k{color:var(--tx2);white-space:nowrap}
table.tbl td.v{font-family:var(--mono);font-size:11.5px}
table.tbl td.v.pending{font-family:var(--sans);font-style:italic;color:var(--tx3)}

/* ---------- 提示块 ---------- */
/* 全站只有一种状态语法：左侧 2px 竖条 + 颜色。不再用色块底纹 */
.note{
  font-size:11.5px;line-height:1.75;color:var(--tx3);
  border:0;border-left:2px solid var(--line2);border-radius:0;
  padding:3px 0 3px 12px;background:transparent;
}
.note b{color:var(--tx2);font-weight:620}
.note.ok{border-left-color:var(--ok)}
.note.acc{border-left-color:var(--accent)}
.note+.note{margin-top:12px}

/* ---------- 证据抽屉 ---------- */
aside#ev{
  position:fixed;top:0;right:0;bottom:0;width:452px;max-width:100%;
  background:var(--surface);border-left:1px solid var(--line2);
  overflow-y:auto;padding:0;z-index:60;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  box-shadow:-1px 0 0 var(--line2),-18px 0 44px rgba(10,15,20,.10);
}
aside#ev.open{transform:translateX(0)}
.ev-bar{
  position:sticky;top:0;background:var(--surface);
  border-bottom:1px solid var(--line);padding:13px 18px;
  display:flex;align-items:center;gap:9px;z-index:2;
}
.ev-bar b{font-size:12px;font-weight:640;color:var(--tx)}
.ev-close{
  margin-left:auto;background:transparent;border:1px solid var(--line);
  color:var(--tx2);border-radius:var(--r);width:26px;height:26px;cursor:pointer;
  font-size:15px;line-height:1;display:grid;place-items:center;transition:.14s;
}
.ev-close:hover{color:var(--tx);border-color:var(--tx3)}
.ev-body{padding:18px}

.vstk{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px;margin-bottom:16px}
.vstk div{
  font-size:10px;padding:0 0 0 8px;border:0;border-left:2px solid var(--line2);
  border-radius:0;text-align:left;line-height:1.55;color:var(--tx3);
}
.vstk .s-ok{color:var(--ok);border-left-color:var(--ok)}
.vstk .s-warn{color:var(--warn);border-left-color:var(--warn)}

.ftitle{font-size:13.5px;font-weight:620;line-height:1.6;margin-bottom:10px}
.fmeta{font:11px/1.85 var(--mono);color:var(--tx3);margin-bottom:14px;word-break:break-word}
.fmeta b{color:var(--tx2);font-family:var(--sans);font-weight:600;font-size:11.5px}

.quote{
  border-left:2px solid var(--line2);padding:2px 0 2px 12px;margin-bottom:14px;
  font-size:11.5px;line-height:1.72;color:var(--tx2);
}
.quote em{font-style:italic}
.quote mark{
  background:var(--accent-soft);color:var(--tx);font-style:normal;
  padding:0 2px;border-radius:2px;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
}
.quote-zh{
  font-size:11.5px;color:var(--tx3);margin-top:8px;font-style:normal;
  padding-top:8px;border-top:1px solid var(--line);
}

/* ---------- 对话检索 ---------- */
.aibar{border:1px solid var(--line2);border-left:2px solid var(--accent);padding:11px 13px;
  margin-bottom:14px;background:var(--surface)}
.airow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ailbl{font:600 11px/1 var(--mono);color:var(--accent);letter-spacing:.08em;flex:none}
.airow input{flex:1;min-width:180px;font:inherit;font-size:13.5px;padding:7px 9px;
  border:1px solid var(--line2);border-radius:var(--r);background:var(--bg);color:var(--tx)}
.aicard{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.aih{font-size:11px;color:var(--tx3);letter-spacing:.08em;margin-bottom:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 7px;
  border:1px solid var(--line2);border-radius:var(--r);background:var(--surface2);color:var(--tx)}
.chip i{font-style:normal;font-size:10px;color:var(--tx3)}
.chip b{cursor:pointer;color:var(--tx3);font-weight:400;margin-left:2px;padding:0 2px}
.chip b:hover{color:var(--danger)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.cond{font-size:12px;color:var(--tx2);margin-bottom:7px}
.aiexp{font-size:12.5px;color:var(--tx2);line-height:1.75;margin-bottom:10px}
.aiact{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.aistr{font:11.5px/1.65 var(--mono);color:var(--tx2);background:var(--surface2);
  padding:8px 10px;border-radius:var(--r);white-space:pre-wrap;word-break:break-all}
.hit-a.en{border-top:1px dotted var(--line);margin-top:5px;padding-top:5px;color:var(--tx3)}
/* ---------- 通用 ---------- */
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
/* 全站唯一实心元素：主要动作。其余按钮一律描边 */
.btn{
  font-size:12px;font-weight:600;padding:7px 14px;border-radius:var(--r);cursor:pointer;
  background:var(--accent);color:var(--bg);
  border:1px solid var(--accent);transition:.14s;
  font-family:var(--sans);
}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--tx2);border-color:var(--line2)}
.btn.ghost:hover{color:var(--tx);border-color:var(--tx3)}
.hint{font-size:11.5px;color:var(--tx3);line-height:1.7}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
pre.code{
  font:11px/1.7 var(--mono);color:var(--tx2);background:var(--surface2);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:13px;
  overflow-x:auto;white-space:pre;
}

/* ---------- 资源导航 ---------- */
/* 资源：目录式列表，不套卡片。分隔靠顶部细线，靠悬停底色标示可点 */
.res-intro{margin-bottom:18px}
.res-group{margin-bottom:24px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:0 26px}
.res{
  display:flex;flex-direction:column;gap:5px;
  border:0;border-top:1px solid var(--line);border-radius:0;
  padding:11px 2px 13px;background:transparent;
  transition:background .14s;text-decoration:none;border-bottom:0;
}
.res:hover{background:var(--accent-soft);border-bottom-color:transparent}
.res-top{display:flex;align-items:baseline;gap:7px}
.res-name{font-size:13px;font-weight:640;color:var(--tx);line-height:1.35}
.res-go{margin-left:auto;color:var(--tx3);flex:none;display:flex;align-items:center}
.res-go svg{width:11px;height:11px}
.res:hover .res-go{color:var(--accent)}
.res-desc{font-size:11.5px;color:var(--tx2);line-height:1.62}
.res-foot{
  display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:3px;
}
.res-use{font-size:10.5px;color:var(--tx3);font-weight:400}
.res-basis{margin-left:auto;font-size:10.5px;color:var(--tx3);flex:none}

/* ---------- 底栏 ---------- */
footer{
  flex:none;border-top:1px solid var(--line);background:var(--surface);
  padding:9px var(--gut);display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  font-size:11px;z-index:10;
}
.foot-note{color:var(--tx3);font-size:10.5px}

/* ---------- 响应式 ---------- */
@media (max-width:980px){
  .shell{flex-direction:column}
  nav{
    width:100%;display:flex;overflow-x:auto;padding:8px;
    border-right:0;border-bottom:1px solid var(--line);gap:2px;
  }
  .navgrp,.nav-docs{display:none}
  .step-item{flex:none;width:auto;margin:0;padding:7px 11px;border-left:0;border-bottom:2px solid transparent}
  .step-item.on{border-bottom-color:var(--accent)}
  .step-item .s{display:none}
  main{padding:20px 18px 80px}
  aside#ev{width:100%}
  header{height:auto;padding:10px 16px;flex-wrap:wrap;gap:10px}
  .hb{width:100%;justify-content:flex-start;flex-wrap:wrap}
  .res-grid{grid-template-columns:1fr}
  .sbody{grid-template-columns:1fr}
  .sbody>aside,.sbody>section{grid-column:auto}
  .fcol{position:static;max-height:none}
}

.selfck{border:1px solid var(--line2);border-left:2px solid var(--accent);padding:12px 14px;margin:0 0 14px}
.selfck-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.selfck dl{display:grid;grid-template-columns:96px 1fr;gap:5px 12px;margin:0 0 8px}
.selfck dt{color:var(--tx3);font-size:11.5px}
.selfck dd{margin:0;font-size:12px;color:var(--tx);word-break:break-all}

.clipsel{position:relative;min-width:0}
.clipmenu{margin-top:7px;border:1px solid var(--line2);background:var(--surface);max-height:230px;overflow:auto}
.clipmi{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 10px;font:inherit;font-size:12px;color:var(--tx);background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.clipmi:last-child{border-bottom:0}
.clipmi:hover{background:var(--surface2)}
.clipmi.on{color:var(--accent);font-weight:600}
.clipmi i{font-style:normal;margin-left:auto;color:var(--tx3);font-size:10.5px;font-family:var(--mono)}
.clipmi.new{color:var(--tx2)}

/* ---------- 文献检索视图（知网式三栏：检索框 / 左侧分组 / 右侧结果） ---------- */
.sbar{position:sticky;top:0;z-index:6;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:12px 0 11px;background:var(--bg);border-bottom:1px solid var(--line)}
.sbar select,.sbar input{font:inherit;font-size:13px;color:var(--tx);
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:7px 10px;outline:none}
.sbar input{flex:1;min-width:180px}
.sbar input:focus{border-color:var(--accent)}
.search-history{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.search-history details{position:relative;min-width:145px;max-width:100%;}
.search-history summary{cursor:pointer;color:var(--tx2);font-size:12px;padding:5px 8px;border:1px solid var(--line2);background:var(--surface);border-radius:4px}
.search-history-panel{position:absolute;z-index:7;top:calc(100% + 5px);left:0;min-width:240px;max-width:min(92vw,420px);max-height:310px;overflow:auto;padding:7px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 5px 18px #152d2920}
.search-history-row{display:flex;align-items:center;gap:6px;padding:4px;border-bottom:1px solid var(--line)}
.search-history-row button[data-search-recent],.search-history-row button[data-search-saved]{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}
.search-history-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:6px}
.search-date-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.search-date-bar label{display:flex;align-items:center;gap:5px;color:var(--tx2);font-size:12px}
.search-date-bar input,.search-date-bar select{min-width:86px;padding:5px 7px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);color:var(--tx);font:inherit}
.search-date-bar button{font:inherit;font-size:12px}
/* 检索页两栏：筛选栏常驻但绝不浮起。原来用 sticky + overflow，
   长列表滚动时它会盖在结果上，看起来像弹窗——栏就是栏，不该有层。 */
.sbody{display:grid;grid-template-columns:298px minmax(0,1fr);gap:28px;padding-top:14px;align-items:start}
.sbody>aside{grid-column:1;position:static;width:auto;height:auto;transform:none;box-shadow:none;border:0;background:transparent;overflow:visible;z-index:auto;padding:0}
.sbody>section{grid-column:2;min-width:0}
.fcol{min-width:0;padding-right:2px}
.fg{border-bottom:1px solid var(--line);padding:8px 0}
.fg>b{display:block;font-size:11px;letter-spacing:.04em;color:var(--tx3);margin-bottom:5px;font-weight:600}
.fo{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);
  padding:1.5px 0;cursor:pointer;border-radius:var(--r)}
.fo:hover{color:var(--accent)}
.fo i{margin-left:auto;font-style:normal;color:var(--tx3);font-size:11px}
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:9px;border-bottom:1px solid var(--line)}
.search-source-tabs{display:flex;gap:3px;border:1px solid var(--line2);padding:2px;border-radius:4px;background:var(--surface)}
.search-source-tabs button{font:inherit;font-size:12px;padding:5px 8px;border:0;background:transparent;color:var(--tx2);cursor:pointer;border-radius:3px}
.search-source-tabs button.on{background:var(--accent);color:white}
.hit{padding:13px 0;border-bottom:1px solid var(--line)}
.hit-t{font-size:14.5px;font-weight:600;line-height:1.55;cursor:pointer;color:var(--tx)}
.hit-t:hover{color:var(--accent)}
.hit-t em{font-style:normal;background:var(--accent-soft);color:var(--accent-2);padding:0 2px;border-radius:0}
.hit-m{font-size:12px;color:var(--tx3);margin-top:5px;line-height:1.7}
.hit-b{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px;align-items:baseline}
.hit-a{font-size:12px;color:var(--tx2);line-height:1.78;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.abs-full{font-size:12px;line-height:1.92;color:var(--tx2);white-space:pre-wrap}
.abs-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.langseg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.langseg button{padding:2px 10px;font:500 11.5px/1.7 var(--sans);background:transparent;
  color:var(--tx2);border:0;border-left:1px solid var(--line2);cursor:pointer}
.langseg button:first-child{border-left:0}
.langseg button:hover:not(.on){background:var(--surface2);color:var(--tx)}
.langseg button.on{background:var(--accent);color:var(--bg)}
.al{display:grid;grid-template-columns:1fr 1fr;column-gap:22px;align-items:start}
.al-col{display:flex;flex-direction:column;gap:7px;min-width:0}
.al-col p{margin:0;font-size:12px;line-height:1.85}
.al-en{color:var(--tx3)}
.al-zh{color:var(--tx2)}
@media (max-width:760px){
  .al{grid-template-columns:1fr;column-gap:0}
  .al-col+.al-col{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
}
.lk{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft);white-space:nowrap}
.lkrow{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:12px;line-height:2}
.lkname{color:var(--tx3);min-width:96px}
.lk:hover{border-bottom-color:var(--accent)}
.sqhelp{margin:10px 0 0;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r);
  background:var(--surface);font-size:12px;color:var(--tx2)}
.sqhelp b{display:block;font-size:12px;color:var(--tx);margin-bottom:8px}
.sqhelp dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 8px}
.sqhelp dt{font-family:var(--mono);font-size:11.5px;color:var(--accent-2);white-space:nowrap}
.sqhelp dd{margin:0;color:var(--tx3);font-size:11.5px}
.aiqs{display:flex;gap:7px;flex-wrap:wrap;padding:9px 0 2px}
.aiq{font:400 11.5px/1.6 var(--sans);color:var(--tx2);background:transparent;text-align:left;
  border:1px solid var(--line2);border-radius:var(--r);padding:4px 9px;cursor:pointer}
.aiq:hover{border-color:var(--accent);color:var(--accent)}
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:2px 0 10px}
.plabel{font-size:11px;color:var(--tx3);letter-spacing:.05em}
.pbtn{font:inherit;font-size:11.5px;padding:3px 9px;border:1px solid var(--line2);border-radius:var(--r-sm);background:transparent;color:var(--tx2);cursor:pointer;line-height:1.6}
.pbtn:hover{background:var(--surface2);color:var(--tx)}
.bib{font-family:var(--mono);font-size:11px;line-height:1.85;white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-left:2px solid var(--line2);padding:10px 12px;margin:10px 0 0;cursor:pointer;user-select:all}
/* 材料状态：左侧竖条，不用色块徽章 */
.lv{font-size:10.5px;padding:0 0 0 7px;border:0;border-left:2px solid var(--line2);border-radius:0;font-weight:600;color:var(--tx3)}
.lv3{color:var(--ok);border-left-color:var(--ok)}
.lv2{color:var(--warn);border-left-color:var(--warn)}
.lv1{color:var(--tx3);border-left-color:var(--line2)}
.pg{display:flex;gap:6px;align-items:center;justify-content:center;padding:16px 0;flex-wrap:wrap}
.pg button{font:inherit;font-size:12px;padding:4px 10px;border-radius:var(--r);cursor:pointer;
  background:var(--surface);color:var(--tx2);border:1px solid var(--line)}
.pg button.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.pg button:disabled{opacity:.35;cursor:default}
.page-jump{display:flex;align-items:center;gap:6px;margin-left:8px;font-size:12px;color:var(--tx2)}
.page-jump input{width:68px;min-width:0;padding:5px 7px;font:inherit;font-size:16px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);color:var(--tx)}
.page-jump input:focus{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:44px 0;text-align:center;color:var(--tx3);font-size:13px;line-height:1.9}
.clip-item{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.7;
  padding:7px 0;border-bottom:1px solid var(--line)}
.clip-item b{flex:none;color:var(--accent);font-weight:600}

/* ---------- AI 来源标记：模型/规则生成的内容一律与文献原文分开 ---------- */
.ai-tag,.src-tag{display:inline-block;font-size:10px;font-weight:600;line-height:1.6;
  padding:0 6px;border-left:2px solid;white-space:nowrap;vertical-align:1px}
.ai-tag{color:#7a5a12;border-color:#b8860b;background:#fdf6e3}
[data-theme="dark"] .ai-tag{color:#e0c07a;border-color:#b8860b;background:#241f14}
.src-tag{color:var(--ok);border-color:var(--ok)}

/* ---------- 左侧收集栏 ---------- */
.clipbox{border-top:2px solid var(--accent)}
.clipbox>b{display:flex;align-items:center;gap:6px}
.clipbox>b em{font-style:normal;font-size:10.5px;color:var(--tx3);font-family:var(--mono)}
.clip-list{max-height:176px;overflow:auto;margin:5px 0 4px}
.clip-mini{display:flex;gap:5px;align-items:flex-start;padding:4px 0;
  border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.5}
.clip-mini span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.clip-mini span:hover{color:var(--accent)}
.clip-mini b{font-weight:600;color:var(--tx3);font-family:var(--mono);font-size:10px}
.clip-x{border:0;background:transparent;color:var(--tx3);cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
.clip-x:hover{color:var(--danger)}

/* ---------- 全网实时检索 ---------- */
.live{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.live a{font-size:11.5px;padding:3px 8px;border:1px solid var(--line2);border-radius:var(--r);
  color:var(--tx2);text-decoration:none;background:var(--surface)}
.live a:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- 扩写候选 ---------- */
.expr{margin-top:8px}
.exprow{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.expchip{font-size:11px;padding:2px 7px;border:1px dashed var(--line2);border-radius:var(--r);
  color:var(--tx2);background:transparent;cursor:pointer;font-family:var(--mono)}
.expchip:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- 模型配置 ---------- */
.llmbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.llmbar label{display:block;font-size:11px;color:var(--tx3);margin-bottom:3px}
.llmbar input{width:100%;font-size:11.5px;padding:5px 7px;border:1px solid var(--line2);
  border-radius:var(--r);background:var(--surface);color:var(--tx)}
.llmstat{font-size:11.5px;margin-top:6px;line-height:1.75}

/* ---------- 左栏的 AI 检索：仿 DeepSeek 那种极简圆角输入区 ---------- */
.aiside{padding:2px 0 11px;border-bottom:1px solid var(--line)}
.aiside .aih{font-size:11px;font-weight:650;color:var(--tx2);letter-spacing:.02em;margin-bottom:7px}
.aiinput{position:relative;display:flex;align-items:center}
.aiinput input{width:100%;font:inherit;font-size:12.5px;line-height:1.6;padding:9px 34px 9px 12px;
  border:1px solid var(--line2);border-radius:20px;background:var(--surface2);color:var(--tx);
  outline:none;transition:border-color .15s,background .15s}
.aiinput input:focus{border-color:var(--accent);background:var(--surface)}
.aiinput input::placeholder{color:var(--tx3)}
.aigo{position:absolute;right:5px;width:24px;height:24px;border-radius:50%;border:0;
  background:var(--accent);color:var(--bg);font-size:13px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.aigo:hover{background:var(--accent-2)}
.aiquick{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.aiquick button{font-size:10.5px;padding:2px 7px;border:1px solid var(--line2);border-radius:12px;
  background:transparent;color:var(--tx3);cursor:pointer}
.aiquick button:hover{border-color:var(--accent);color:var(--accent)}
.btn.tiny{font-size:10.5px;padding:2px 8px}

/* 窄栏里的解析卡：横向卡片压成竖排 */
.aiside .aicard{margin-top:10px;padding:9px 0 0;border-top:1px solid var(--line)}
.aiside .aicard .aih{font-size:10.5px;margin-bottom:6px}
.aiside .chips{gap:4px}
.aiside .chip{font-size:10.5px;padding:1px 6px;border-radius:11px}
.aiside .cond{font-size:10.5px;margin-top:5px}
.aiside .cond.est{color:var(--accent)}
.aiside .aiexp{font-size:11px;line-height:1.7;margin-top:6px}
.aiside .aiact{margin-top:7px;gap:5px;display:flex;flex-wrap:wrap}
.aiside .aistr{margin-top:7px;max-height:88px;overflow:auto}
.aiside .aistr code{display:block;font-size:10px;line-height:1.65;word-break:break-all;
  background:var(--surface2);padding:6px 7px;border-radius:var(--r);color:var(--tx2)}
.aiside .live{gap:4px;margin-top:7px}
.aiside .live a{font-size:10.5px;padding:2px 6px}
.aiside .expr{margin-top:7px}
.aiside .expchip{font-size:10px;padding:1px 5px}
.aiside .hint{font-size:10.5px;line-height:1.65}

/* ---------- 收藏夹：左栏独立一栏，证据夹全部内容搬到这里 ---------- */
.clipbox{border-top:0;border-bottom:1px solid var(--line);padding:11px 0}
.clipbox>b{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:650;color:var(--tx2)}
.clipbox>b em{font-style:normal;font-size:10px;color:var(--tx3);font-family:var(--mono);font-weight:400}
.clip-list{max-height:220px;overflow:auto;margin:6px 0 5px}
.clip-mini{display:flex;gap:5px;align-items:flex-start;padding:5px 0;
  border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.45}
.clip-mini span{flex:1;min-width:0;cursor:pointer;color:var(--tx2)}
.clip-mini span:hover{color:var(--accent)}
.clip-mini span i{display:block;font-style:normal;font-size:10px;color:var(--tx3);margin-top:1px}
.clip-mini b{font-weight:600;color:var(--tx3);font-family:var(--mono);font-size:10px;padding-top:1px}
.clip-x{border:0;background:transparent;color:var(--tx3);cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
.clip-x:hover{color:var(--danger)}
.clipact{display:flex;gap:4px;flex-wrap:wrap}
#clipBib pre.bib{max-height:176px;overflow:auto;font-size:10px;line-height:1.6;
  background:var(--surface2);padding:7px;border-radius:var(--r);margin:6px 0 0;word-break:break-all}
#clipBib .hint{font-size:10.5px;line-height:1.7}

/* ---------- 模型配置收进折叠块，不占左栏常驻空间 ---------- */
.llmwrap{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.llmwrap summary{font-size:10.5px;color:var(--tx3);cursor:pointer;line-height:1.6}
.aiside .llmbar{grid-template-columns:1fr;gap:6px;margin-top:7px}
.aiside .llmbar input{font-size:11px;padding:5px 7px}

/* ---------- AI 问答：只有模型真的答了才挂 AI 生成 ---------- */
.qaask{display:flex;gap:5px;margin-top:9px}
.qaask input{flex:1;min-width:0;font:inherit;font-size:11.5px;padding:6px 10px;
  border:1px solid var(--line2);border-radius:16px;background:var(--surface2);color:var(--tx);outline:none}
.qaask input:focus{border-color:var(--accent);background:var(--surface)}
.qaask button{border:0;background:var(--accent);color:var(--bg);border-radius:16px;
  padding:0 11px;font-size:11px;cursor:pointer}
.qacard{margin:0 0 16px;padding:13px 15px;border-left:2px solid #b8860b;background:var(--surface)}
.qahd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-bottom:8px}
.qahd span{color:var(--tx2)}
.qahd #qaClose{margin-left:auto}
.qatext{font-size:13px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.qaref{font-family:var(--mono);font-size:11px;border:0;background:var(--accent-soft);
  color:var(--accent);border-radius:3px;padding:0 3px;cursor:pointer;margin:0 1px}
.qaref:hover{background:var(--accent);color:var(--bg)}
.qaref.bad{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.qabad{margin:9px 0 0;padding:8px 10px;border-left:2px solid var(--danger);
  font-size:11.5px;line-height:1.75;color:var(--tx2)}
.qarefs{margin-top:10px}
.qarefs summary{font-size:11px;color:var(--tx3);cursor:pointer}
.qarefrow{display:flex;gap:6px;align-items:baseline;font-size:11.5px;padding:4px 0;
  border-bottom:1px solid var(--line)}
.qarefrow span{flex:1;min-width:0;cursor:pointer;color:var(--tx2)}
.qarefrow span:hover{color:var(--accent)}
.qarefrow i{font-style:normal;font-size:10px;color:var(--tx3);font-family:var(--mono)}

.llmpre{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0 3px}
.llmpre .expchip{font-size:10.5px;padding:2px 7px}

/* ---------- 收藏夹：命名分类 ---------- */
.cliphd{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 6px}
.cliphd .btn{font-size:10px;padding:2px 7px}
.clipcat{border-top:1px solid var(--line);padding:2px 0}
.clipcat-hd{display:flex;align-items:center;gap:5px}
.clipcat-t{flex:1;min-width:0;text-align:left;border:0;background:transparent;color:var(--tx);
  font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;padding:4px 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clipcat-t:hover{color:var(--accent)}
.clipcat-hd em{font-style:normal;font-size:10px;color:var(--tx3);font-family:var(--mono)}
.clipcat-hd .clip-x{font-size:13px;line-height:1}
.clipconfirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;line-height:1.65;color:var(--tx2);background:var(--surface2);border-left:2px solid var(--danger);padding:6px 8px;margin:3px 0 5px}
.clipconfirm .clipcf{margin-left:auto;display:flex;gap:5px}
.clipconfirm .btn{background:var(--danger);border-color:var(--danger)}
.clipconfirm .btn.ghost{background:none;color:var(--tx2);border-color:var(--line2)}
.clipmv{display:flex;align-items:center;gap:4px;margin:3px 0 0;font-size:10px}
.clipmv label{flex:1;min-width:0;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clipmv select{font:inherit;font-size:10px;padding:1px 3px;border:1px solid var(--line2);
  border-radius:var(--r);background:var(--surface);color:var(--tx)}

/* 修订版：用数据摘要说明当前材料覆盖面，保持现有工作台结构。 */
.data-summary{display:flex;justify-content:space-between;gap:24px;align-items:center;margin:2px 0 24px;padding-bottom:21px;border-bottom:1px solid var(--line)}
.data-summary h1{font:600 25px/1.3 var(--sans);letter-spacing:-.6px;margin:0 0 7px}
.data-summary p{font-size:12px;color:var(--tx3);margin:0}
.data-summary dl{display:flex;gap:26px;margin:0}.data-summary dt{font-size:10.5px;color:var(--tx3);margin-bottom:5px}.data-summary dd{font:500 21px/1.3 var(--mono);margin:0;color:var(--tx)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:active{transform:translateY(1px)}
.textlink{border:0;background:none;color:var(--accent);padding:0;text-align:left;font:inherit;cursor:pointer}
@media(max-width:980px){.sbody{display:flex;flex-direction:column;gap:24px}.sbody>aside,.sbody>section{width:100%;min-width:0}.sbody>section{order:0}.sbody>aside{order:1}}
@media(max-width:700px){.data-summary{align-items:flex-start;flex-direction:column;gap:18px}.data-summary dl{gap:23px;flex-wrap:wrap}.data-summary dd{font-size:19px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
{{WORKCSS}}
</style>

function searchPrefRead(key,fallback){

  document.querySelectorAll('[data-search-saved]').forEach(button=>button.onclick=()=>{const item=searchPrefRead(SEARCH_SAVED_KEY,[]).find(row=>row.name===button.dataset.searchSaved);if(!item)return;SRCH.q=item.query;SRCH.field=item.field||'all';SRCH.yearFrom=item.yearFrom||0;SRCH.yearTo=item.yearTo||0;SRCH.sort=item.sort||'rel';SRCH.page=1;SRCH.groups=null;rememberSearch();renderMain();runCatalogSearch();});
  document.querySelectorAll('[data-search-history-remove]').forEach(button=>button.onclick=()=>{const query=button.dataset.searchHistoryRemove;searchPrefWrite(SEARCH_HISTORY_KEY,searchPrefRead(SEARCH_HISTORY_KEY,[]).filter(row=>row.query!==query));refreshSearchHistory();});
  document.querySelectorAll('[data-search-saved-remove]').forEach(button=>button.onclick=()=>{const name=button.dataset.searchSavedRemove;searchPrefWrite(SEARCH_SAVED_KEY,searchPrefRead(SEARCH_SAVED_KEY,[]).filter(row=>row.name!==name));refreshSearchHistory();});
  $('#searchHistoryClear')?.addEventListener('click',()=>{searchPrefWrite(SEARCH_HISTORY_KEY,[]);refreshSearchHistory();});
  $('#searchSaveCurrent')?.addEventListener('click',()=>{$('#searchSavedName').hidden=false;$('#searchSaveConfirm').hidden=false;$('#searchSavedName').focus();});

}
function mergeGuestSearchData(){
  if(!PersonalStore.user)return;
  for(const [localKey,accountKey]of [[SEARCH_HISTORY_KEY,SEARCH_HISTORY_KEY],[SEARCH_SAVED_KEY,SEARCH_SAVED_KEY],[CLIP_KEY,CLIP_KEY]]){
    try{const guest=JSON.parse(localStorage.getItem(localKey)||'[]'),account=JSON.parse(PersonalStore.getItem(accountKey)||'[]');if(!Array.isArray(guest)||!Array.isArray(account))continue;
      const identity=row=>accountKey===CLIP_KEY?(row.id||''):(accountKey===SEARCH_HISTORY_KEY?row.query:row.name);
      const merged=account.map(row=>({...row})),seen=new Set(account.map(identity));for(const row of guest){const key=identity(row);if(accountKey===CLIP_KEY&&seen.has(key)){const target=merged.find(item=>identity(item)===key);target.items=[...new Set([...(target.items||[]),...(row.items||[])])];}else if(!seen.has(key)){merged.push(row);seen.add(key);}}

const SRCH = {q:"", field:"all", years:[], topics:[], journals:[], groups:null, oa:false, onlyV:false, hasAbs:false, yearFrom:0, yearTo:0, zhOnly:false,
              dateBasis:"first", sort:"rel", page:1, per:20, scope:"all", cats:[], exported:false,source:"local",onlineRecords:[],onlineCount:0,onlineNext:null,onlineCursor:'*',onlineStack:['*'],onlineError:''};
const ONLINE_DOCS=new Map();

const PRESETS = [
  ["复现性", "reproducibility radiomics"],
  ["报告规范", "radiomics quality score"],
  ["分割变异", "segmentation variability"],
  ["特征稳定", "feature stability"],
  ["外部验证", "external validation radiomics"],
  ["LIDC 数据", "LIDC-IDRI"],
  ["深度学习", "deep learning radiomics"],
  ["偏倚风险", "risk of bias radiomics"]
];

/* 检索框的规则语法。一个解析器管到底：空格=与、"短语"、-词=排除、
   2019-2024 或 year:2019-2024=年份区间、title:/author:/journal:=限定字段。
   解析失败一律退化成普通关键词，不抛错——检索框不该因为少一个引号就罢工。 */
function parseSQ(q){
  const raw=(q||"").trim();
  const out={inc:[],exc:[],phr:[],yf:0,yt:0,fld:"all"};
  if(!raw) return out;
  let rest=raw.replace(/"([^"]+)"/g,(m,p)=>{ out.phr.push(p.toLowerCase().trim()); return " "; });
  rest=rest.replace(/\b(title|author|journal):/gi,(m,f)=>{ out.fld=f.toLowerCase(); return " "; });
  rest=rest.replace(/\byear:(\d{4})(?:\s*-\s*(\d{4}))?\b/gi,(m,a,b)=>{
    out.yf=+a; out.yt=+(b||a); return " "; });
  const rng=rest.match(/\b(?:19|20)\d{2}\s*-\s*(?:19|20)\d{2}\b/);
  if(rng){
    const p=rng[0].split("-");
    out.yf=+p[0].trim(); out.yt=+p[1].trim();
    rest=rest.replace(rng[0]," ");
  }
  rest.split(/[\s,;，；、]+/).filter(Boolean).forEach(w=>{
    if(/^[-!]/.test(w) && w.length>2){ out.exc.push(w.slice(1).toLowerCase()); return; }
    const lw=w.toLowerCase();
    if(lw.length>1 || /^[a-z0-9]$/.test(lw)) out.inc.push(lw);
  });
  return out;
}
function sqOf(){
  return SRCH._sq || {inc:[],exc:[],phr:[],yf:0,yt:0,fld:"all"};
}
function sWords(q){
  const sq=parseSQ(q);
  SRCH._sq=sq;
  SRCH._intent=(q||"").trim() && !["author","journal"].includes(sq.fld!=="all"?sq.fld:SRCH.field)?AIQ.aiParse(sq.inc.concat(sq.phr).join(" ")):null;
  return sq.inc.concat(sq.phr);
}
function sField(d,f){
  if(f==="title")   return d.title;
  if(f==="author")  return d.authors_full||d.authors;
  if(f==="journal") return d.journal;
  return d.title+" "+(d.authors_full||d.authors||"")+" "+(d.journal||"")+" "+((d.topics||[]).join(" "))+" "+(ABS[d.key]||"")+" "+(ZHSRC[d.key]&&ABS[d.key]?.includes(ZHSRC[d.key])?ZH[d.key]||"":"")+" "+(d.pmid||"")+" "+(d.doi||"");
}
function sScore(d,words){
  if(!words.length) return 1;
  const hay=(sField(d,SRCH.field)||"").toLowerCase();
  let sc=0;
  for(const w of words){
    if(hay.indexOf(w)<0) return 0;
    sc+=1;
    if((d.title||"").toLowerCase().indexOf(w)>=0) sc+=6;
    if((d.authors||"").toLowerCase().indexOf(w)>=0) sc+=2;
    if((d.journal||"").toLowerCase().indexOf(w)>=0) sc+=2;
  }
  return sc;
}
function activeGroups(words){
  if(SRCH.groups && SRCH.groups.length) return SRCH.groups;
  if(SRCH._intent){
    const it=SRCH._intent;
    return AIQ.aiQuery(it).groups.concat(sqOf().phr.map(w=>[w]));
  }
  return (words||[]).map(w=>[w]);
}
function flatWords(groups){
  const out=[];
  (groups||[]).forEach(g=>g.forEach(w=>{ if(w && out.indexOf(w)<0) out.push(w); }));
  return out;
}
// 组间必须全部命中，组内命中任一同义词即可
function sScoreG(d,groups){
  if(!groups.length) return 1;
  // 字段限定来自检索框（title:/author:/journal:），没写就用手选的下拉值
  const _fld=sqOf().fld;
  const hay=(sField(d,_fld!=="all"?_fld:SRCH.field)||"").toLowerCase();
  const t=(d.title||"").toLowerCase(), au=(d.authors||"").toLowerCase(),
        jn=(d.journal||"").toLowerCase();
  let sc=0;
  for(const g of groups){
    let hit=false;
    for(const w of g){ if(w && termMatches(hay,w)){ hit=true; break; } }
    if(!hit) return 0;
    sc+=1;
    for(const w of g){ if(termMatches(t,w)){ sc+=6; break; } }
    for(const w of g){ if(termMatches(au,w)){ sc+=2; break; } }
    for(const w of g){ if(termMatches(jn,w)){ sc+=2; break; } }
  }
  return sc;

function termMatches(hay,word){
  word=String(word||"").toLowerCase();

  return hay.includes(word);
}
function publicationYear(d){return SRCH.dateBasis==='issue'?String(d.year||''):String(d.firstdate||d.year||'').slice(0,4);}
function sBaseG(groups){ return LIB.filter(d=>!d.date_pending && sScoreG(d,groups)>0); }
function sBase(words){ return sBaseG(activeGroups(words)); }
function sHits(words){
  const groups=activeGroups(words), SQ=sqOf();
  let arr=[];
  for(const d of sBaseG(groups)){
    if(SRCH.years.length && SRCH.years.indexOf(publicationYear(d))<0) continue;
    if(SRCH.topics.length && !(d.topics||[]).some(t=>SRCH.topics.indexOf(t)>=0)) continue;
    if(SRCH.journals.length && SRCH.journals.indexOf((d.journal||"").trim())<0) continue;
    if(SRCH.oa && !d.oa) continue;
    if(SRCH.onlyV && d.level<3) continue;
    if(SRCH.hasAbs && !ABS[d.key] && !d.has_abstract) continue;
    if(SRCH.yearFrom && (+publicationYear(d)||0)<SRCH.yearFrom) continue;
    if(SRCH.yearTo && (+publicationYear(d)||0)>SRCH.yearTo) continue;
    if(SRCH.zhOnly && !ReaderUI.chinese(d.key) && !d.has_zh) continue;
    if(SRCH._intent?.yearFrom && (+publicationYear(d)||0)<SRCH._intent.yearFrom) continue;
    if(SRCH._intent?.oa && !d.oa) continue;
    if(SQ.exc.length){
      const hay=((d.title||"")+" "+(d.authors||"")+" "+(d.journal||"")).toLowerCase();
      if(SQ.exc.some(w=>termMatches(hay,w))) continue;
    }
    if(SQ.yf){ const y=+publicationYear(d)||0; if(y && (y<SQ.yf || y>SQ.yt)) continue; }
    arr.push({d,sc:sScoreG(d,groups)});
  }
  if(SRCH.sort==="cite") arr.sort((a,b)=>b.d.cited-a.d.cited);
  else if(SRCH.sort==="year"||SRCH.sort==="oldest") arr.sort((a,b)=>{const ay=String(SRCH.dateBasis==='issue'?a.d.year:a.d.firstdate||a.d.year),by=String(SRCH.dateBasis==='issue'?b.d.year:b.d.firstdate||b.d.year);return SRCH.sort==='oldest'?ay.localeCompare(by):by.localeCompare(ay);});
  else if(SRCH.sort==="title") arr.sort((a,b)=>String(a.d.title).localeCompare(String(b.d.title)));
  else if(!SRCH.q&&!SRCH.groups) arr.sort((a,b)=>String(b.d.firstdate||b.d.year).localeCompare(String(a.d.firstdate||a.d.year))||b.d.level-a.d.level||b.d.cited-a.d.cited);
  else arr.sort((a,b)=>b.sc-a.sc||b.d.cited-a.d.cited);
  const seen=new Map(),unique=[];
  for(const row of arr){
    const d=row.d,title=String(d.title||'').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,''),authors=String(d.authors_full||d.authors||'').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'').slice(0,80);
    const id=d.doi?'doi:'+d.doi.toLowerCase().trim():d.pmid?'pmid:'+d.pmid:'title:'+title+'|'+String(d.year||'')+'|'+authors;
    const previous=seen.get(id);
    if(!previous){seen.set(id,row);row.versions=[d];unique.push(row);continue;}
    previous.versions.push(d);
    if(d.oa&&!previous.d.oa)previous.d=d;
  }
  return unique;
}
function sFacets(words){
  const base=sBaseG(activeGroups(words)), y={}, t={}, j={};
  base.forEach(d=>{
    const yr=publicationYear(d);if(yr) y[yr]=(y[yr]||0)+1;
    (d.topics||[]).forEach(x=>t[x]=(t[x]||0)+1);
    const jn=(d.journal||"").trim();
    if(jn) j[jn]=(j[jn]||0)+1;
  });
  return {years:Object.entries(y).sort((a,b)=>b[0].localeCompare(a[0])),
          topics:Object.entries(t).sort((a,b)=>b[1]-a[1]),
          journals:Object.entries(j).sort((a,b)=>b[1]-a[1]).slice(0,10), pool:base.length};
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hl(s,words){
  let out=esc(s||"");

  const pat=words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).filter(Boolean).join("|");

function numericTokens(text){
  return (String(text||"").replace(/\[\d+\]/g,"").match(/\d+(?:\.\d+)?/g)||[])
    .map(v=>String(Number(v)));
}
function checkAnswer(answer,refs){
  const matches=[...String(answer).matchAll(/\[(\d+)\]/g)];
  const ids=[...new Set(matches.map(m=>Number(m[1])))];
  const bad=ids.filter(i=>!Number.isSafeInteger(i)||i<1||i>refs.length);
  const chunks=String(answer).split(/\n+/).map(v=>v.trim()).filter(Boolean);
  const factual=chunks.filter(v=>v.length>8 && !/^#{1,6}\s/.test(v)
    && !/^(结论|依据|参考文献|不足之处)[：:]?$/.test(v)
    && !/^(所给文献未提及|所给文献不足|无法依据所给材料)/.test(v));
  const missing=!matches.length || factual.some(v=>! /\[\d+\]/.test(v));
  const unsupported=[];
  for(const chunk of chunks){
    const cited=[...chunk.matchAll(/\[(\d+)\]/g)].map(m=>Number(m[1])).filter(i=>i>=1&&i<=refs.length);
    if(!cited.length) continue;
    const source=cited.map(i=>{
      const d=refs[i-1];return `${d.title} ${d.year} ${d.qaExcerpt||ABS[d.key]||""}`;
    }).join(" ");
    const available=new Set(numericTokens(source));
    for(const value of numericTokens(chunk)) if(!available.has(value)) unsupported.push(value);
  }
  return {bad,missing,unsupported:[...new Set(unsupported)]};
}

function copyText(t){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return true; }
  }catch(e){}
  try{
    const ta=document.createElement("textarea");
    ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function absClip(key,n){

}

/* 收藏夹：多个可命名分类，存在本机浏览器里，刷新不丢。
   v1 存的是扁平 key 数组，v2 起改为分类；读到旧数据就整体挪进「未分类」。
   CLIP_KEY / CLIP_OLD / CAT_DEFAULT 三个常量定义在 SRCH 之前。 */

function validKeys(a){
  return (Array.isArray(a)?a:[]).filter(k=>LIB.some(x=>x.key===k)||/^[\w.-]{1,160}$/.test(String(k)));
}
function saveCats(){
  try{if(PersonalStore.user)PersonalStore.setItem(CLIP_KEY,JSON.stringify(SRCH.cats));else localStorage.setItem(CLIP_KEY,JSON.stringify(SRCH.cats));}catch(e){}
}
function loadCats(){
  try{
    const s=PersonalStore.user?PersonalStore.getItem(CLIP_KEY):localStorage.getItem(CLIP_KEY);
    if(s){
      const a=JSON.parse(s);
      if(Array.isArray(a)&&a.length){
        const cats=a.filter(c=>c&&typeof c.id==="string").map(c=>({
          id:c.id, name:String(c.name||"未命名").slice(0,24), items:validKeys(c.items)}));
        if(cats.length){
          if(!cats.some(c=>c.id===CAT_DEFAULT)) cats.unshift({id:CAT_DEFAULT,name:"未分类",items:[]});
          return cats;
        }
      }
    }
    const old=validKeys(JSON.parse((PersonalStore.user?PersonalStore.getItem(CLIP_OLD):localStorage.getItem(CLIP_OLD))||"[]"));
    return [{id:CAT_DEFAULT, name:"未分类", items:old}];
  }catch(e){
    return [{id:CAT_DEFAULT, name:"未分类", items:[]}];
  }
}
function catById(id){
  return SRCH.cats.find(c=>c.id===id) || catById0();
}
function catById0(){ return SRCH.cats.find(c=>c.id===CAT_DEFAULT) || SRCH.cats[0]; }
function catOf(key){
  for(const c of SRCH.cats) if(c.items.indexOf(key)>=0) return c;
  return null;
}
function clipCount(){
  return SRCH.cats.reduce((n,c)=>n+c.items.length,0);
}
function removeKey(key){
  SRCH.cats.forEach(c=>{ const i=c.items.indexOf(key); if(i>=0) c.items.splice(i,1); });
}
/* 已在同一个分类里再点就是移出；已在别的分类里则搬过来。 */
function addTo(key, catId){
  removeKey(key);
  const c=catById(catId);
  if(!c) return;
  if(c.items.indexOf(key)<0) c.items.push(key);
  saveCats();
}
function clipMenuHTML(key){
  const cur=catOf(key);
  const rows=SRCH.cats.map(c=>{
    const on=!!cur&&cur.id===c.id;
    return `<button class="clipmi${on?" on":""}" data-clipaddto="${esc(c.id)}" data-key="${esc(key)}">`
      +`${on?"✓ ":""}${esc(c.name)}<i>${c.items.length}</i></button>`;
  }).join("");
  return `<div class="clipmenu">${rows}
    <button class="clipmi new" data-clipnew2="1" data-key="${esc(key)}">+ 新建分类并加入</button></div>`;
}
function toggleKey(key, catId){
  const cur=catOf(key);
  if(cur && cur.id===catId){ removeKey(key); }
  else { removeKey(key); catById(catId).items.push(key); }
  saveCats();
}
function catKey(){
  return "c"+Date.now().toString(36)+Math.floor(Math.random()*1e3).toString(36);
}

/* BibTeX：作者之间用 and，et al. 写成 and others，页码用 -- */
function bibtexOf(d){
  const au=(d.authors_full||d.authors||"").replace(/,\s*et al\.?$/," and others")
                          .split(/,\s*/).filter(Boolean).join(" and ");
  const pages=(d.pages||"").replace(/(\d)-(\d)/,"$1--$2");
  const id=((au.split(/[\s,]+/)[0]||"anon")+(d.year||"")+
            (d.title||"").split(/\s+/).slice(0,2).join("").replace(/[^a-z]/gi,"")).toLowerCase();
  const f=[];
  if(au) f.push("  author = {"+au+"}");
  f.push("  title = {"+(d.title||"").replace(/[{}]/g,"")+"}");
  if(d.journal) f.push("  journal = {"+d.journal+"}");
  if(d.year) f.push("  year = {"+d.year+"}");
  if(d.vol) f.push("  volume = {"+d.vol+"}");
  if(d.issue) f.push("  number = {"+d.issue+"}");
  if(pages) f.push("  pages = {"+pages+"}");
  if(d.doi) f.push("  doi = {"+d.doi+"}");
  if(d.pmid) f.push("  note = {PMID: "+d.pmid+"}");
  return "@article{"+id+",\n"+f.join(",\n")+"\n}";
}

/* RIS：EndNote / NoteExpress / Zotero 都能直接双击导入 */
function risOf(d){
  const L=["TY  - JOUR"];
  (d.authors_full||d.authors||"").replace(/,\s*et al\.?$/,"").split(/,\s*/).filter(Boolean)
                 .forEach(a=>L.push("AU  - "+a));
  
  if(d.title) L.push("TI  - "+d.title);
  if(d.journal) L.push("JO  - "+d.journal);
  if(d.year) L.push("PY  - "+d.year);
  if(d.vol) L.push("VL  - "+d.vol);
  if(d.issue) L.push("IS  - "+d.issue);
  if(d.pages){
    const p=String(d.pages).split("-");
    L.push("SP  - "+p[0]);
    if(p[1]) L.push("EP  - "+p[1]);
  }
  if(d.doi) L.push("DO  - "+d.doi);
  if(d.pmid) L.push("AN  - PMID:"+d.pmid);
  if(d.pmcid) L.push("AN  - PMCID:"+d.pmcid);
  L.push("ER  - ");
  return L.join("\n");
}

function citeText(d){
  const a=(d.authors_full||d.authors||"");
  return `${a}. ${d.title} ${d.journal||""}. ${d.year||""}${d.vol?";"+d.vol:""}${d.issue?"("+d.issue+")":""}${d.pages?":"+d.pages:""}.${d.doi?" doi:"+d.doi:""}`;
}

async function runOnlineSearch(cursor='*'){
  if(!SRCH.q.trim()){SRCH.onlineError='请先输入疾病名称、研究问题或英文检索词。';renderMain();return;}
  const query=SRCH.q.trim();
  if(SRCH.onlineQuery!==query){SRCH.onlineStack=['*'];cursor='*';SRCH.onlineQuery=query;}
  SRCH.onlineError='正在检索 Europe PMC…';SRCH.onlineNext=null;renderMain();
  try{
    const words=sWords(query),groups=activeGroups(words);
    const response=await fetch('/api/library/online',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({groups,yearFrom:SRCH.yearFrom,yearTo:SRCH.yearTo,sort:SRCH.sort,cursor})});
    const value=await response.json();if(!response.ok)throw Error(value.error||'在线检索未完成');
    const unique=new Map();
    for(const row of value.records||[]){
      const journal=row.journalInfo?.journal?.title||row.journalTitle||'',year=String(row.pubYear||'');
      const pmid=String(row.pmid||row.id||''),doi=String(row.doi||''),key=pmid||doi||String(row.pmcid||row.title);
      const doc=normalizeOnlineRecord(row);
      if(!doc.title)continue;
      const id=doi.toLowerCase()||pmid||doc.title.normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')+'|'+year;
      if(!unique.has(id))unique.set(id,doc);
    }
    SRCH.onlineRecords=[...unique.values()];for(const doc of SRCH.onlineRecords){ONLINE_DOCS.set(doc.key,doc);if(doc.abstract)ABS[doc.key]=doc.abstract;}
    SRCH.onlineCount=Number(value.hit_count||0);SRCH.onlineNext=value.next_cursor&&value.next_cursor!==cursor?value.next_cursor:null;SRCH.onlineCursor=cursor;SRCH.onlineError='';SRCH.page=SRCH.onlineStack.length;renderMain();
  }catch(error){SRCH.onlineRecords=[];SRCH.onlineError=error.message;renderMain();}
}
async function runCatalogSearch(){
  if(SRCH.source!=='local'||state.step!=='search'||SRCH.scope==='mine'||!LibraryUI.started)return;
  const words=sWords(SRCH.q),groups=activeGroups(words),sq=sqOf();
  const selectedField=sq.fld!=='all'?sq.fld:SRCH.field;
  const field=({author:'authors'}[selectedField]||selectedField);
  const input={groups,field,page:SRCH.page,limit:SRCH.per,yearFrom:Math.max(SRCH.yearFrom,SRCH._intent?.yearFrom||0,sq.yf||0),yearTo:SRCH.yearTo||sq.yt,sort:SRCH.sort,oa:SRCH.oa||!!SRCH._intent?.oa,onlyV:SRCH.onlyV,hasAbstract:SRCH.hasAbs,years:SRCH.years.map(Number),topics:SRCH.topics,journals:SRCH.journals,zhOnly:SRCH.zhOnly,dateBasis:SRCH.dateBasis,exclude:sq.exc};
  const signature=JSON.stringify(input);
  if(CATALOG_SEARCH.signature===signature)return;
  CATALOG_SEARCH.signature=signature;
  const request=++CATALOG_SEARCH.request;
  CATALOG_SEARCH.active=true;CATALOG_SEARCH.loading=true;CATALOG_SEARCH.error='';
  try{
    const access=await LibraryUI.accessState();
    if(access?.modules?.some(m=>m.id==='search'&&m.visible===false))throw Error('文献检索模块暂未公开');
    CATALOG_SEARCH.signature=signature;
    const cacheKey='search:'+(access.version||LibraryUI.version)+':'+signature;
    let value=await PublicCache.get(cacheKey);
    if(!value){if(access.backend==='static')value=await PublicSearch.search(input,access);else{const response=await fetch('/api/library/search',{method:'POST',headers:{'content-type':'application/json'},body:signature});value=await response.json();if(!response.ok)throw Error(value.error||'全库检索暂不可用');}await PublicCache.put(cacheKey,value);}
    if(request!==CATALOG_SEARCH.request)return;
    CATALOG_SEARCH.docs=value.docs||[];for(const doc of CATALOG_SEARCH.docs){ONLINE_DOCS.set(doc.key,doc);if(doc.abstract)ABS[doc.key]=doc.abstract;}CATALOG_SEARCH.total=Number(value.total||0);CATALOG_SEARCH.loading=false;
  }catch(error){
    if(request!==CATALOG_SEARCH.request)return;
    CATALOG_SEARCH.loading=false;CATALOG_SEARCH.active=false;CATALOG_SEARCH.error=error.message;
  }
  if(request===CATALOG_SEARCH.request&&state.step==='search'&&SRCH.source==='local'){
    const input=document.querySelector('#qInput'),focused=document.activeElement===input,position=input?.selectionStart,scroll=document.querySelector('#main').scrollTop;
    if(input?.dataset.composing==='true')return;
    renderMain();document.querySelector('#main').scrollTop=scroll;
    if(focused){const next=document.querySelector('#qInput');next?.focus({preventScroll:true});next?.setSelectionRange(position,position);}
  }
}
function rerunSearch(){
  if(SRCH.source==='online'){SRCH.onlineStack=['*'];runOnlineSearch('*');}
  else runCatalogSearch();
}
function normalizeOnlineRecord(row){
  const journal=row.journalInfo?.journal?.title||row.journalTitle||'',year=String(row.pubYear||''),pmid=String(row.pmid||row.id||''),doi=String(row.doi||''),key=pmid||doi||String(row.pmcid||row.title);
  return {...row,key,pmid,doi,title:String(row.title||''),authors:row.authorString||'',authors_full:row.authorString||'',journal,year,firstdate:row.firstPublicationDate||'',vol:row.journalInfo?.volume||'',issue:row.journalInfo?.issue||'',pages:row.pageInfo||'',oa:String(row.isOpenAccess||'').toUpperCase()==='Y',level:1,cited:Number(row.citedByCount||0),topics:(row.meshHeadingList?.meshHeading||[]).map(item=>item.descriptorName).filter(Boolean),source_url:pmid?'https://europepmc.org/article/MED/'+encodeURIComponent(pmid):'',publisher_url:(row.fullTextUrlList?.fullTextUrl||[]).find(item=>item.documentStyle==='html')?.url||'',abstract:String(row.abstractText||''),online:true};
}

/* 抽屉和证据夹都是动态重建的，逐个绑会绑到已经不存在的旧节点上。
   这几个按钮统一走 document 委托，跟着节点重建也不会掉。 */
document.addEventListener("click",e=>{
  const t=e.target.closest?e.target.closest("[data-lang],#clipAdd,#selfBtn,#selfClose,[data-fmt],[data-clipx],[data-clipclear],[data-clipnew],[data-clipaddto],[data-clipnew2],[data-clipopen],[data-clipren],[data-clipdel],[data-clipdelask],[data-clipdelcancel],[data-exp]"):null;
  if(!t) return;
  if(t.id==="selfBtn"){ state.selfcheck=1; renderMain(); return; }
  if(t.id==="selfClose"){ state.selfcheck=0; renderMain(); return; }
  if(t.dataset.lang){ LANG=t.dataset.lang; if(state.evKey) openRec(state.evKey); return; }

  if(t.id==="clipAdd"){
    const k=t.dataset.key;
    state.clipMenu = state.clipMenu===k ? null : k;
    openRec(k); return;
  }
  if(t.dataset.clipaddto){
    const k=t.dataset.key, to=t.dataset.clipaddto;
    addTo(k,to); state.clipMenu=null; state.clipOpen=to; renderMain(); openRec(k); return;
  }
  if(t.dataset.clipnew2){
    const k=t.dataset.key;
    const raw=(prompt("新分类的名字，例如：肺结节 / 待读","")||"").trim();
    const name=(raw||("分类 "+(SRCH.cats.length+1))).slice(0,24);
    const id=catKey();
    SRCH.cats.push({id,name,items:[]});
    addTo(k,id); state.clipMenu=null; state.clipOpen=id; renderMain(); openRec(k); return;
  }
  if(t.hasAttribute("data-clipopen")){
    const id=t.getAttribute("data-clipopen");
    state.clipOpen=(state.clipOpen===id)?null:id;
    renderMain(); return;
  }
  if(t.hasAttribute("data-clipnew")){
    const nm=(prompt("新分类名称，例如：肺结节 / 待读 / 复现性方法","")||"").trim();
    if(!nm) return;
    const id=catKey();
    SRCH.cats.push({id, name:nm.slice(0,24), items:[]});
    state.clipOpen=id; saveCats(); renderMain(); return;
  }
  if(t.hasAttribute("data-clipren")){
    const c=catById(t.getAttribute("data-clipren"));
    const nm=(prompt("重命名分类", c.name)||"").trim();
    if(!nm) return;
    c.name=nm.slice(0,24); saveCats(); renderMain(); return;
  }
  if(t.hasAttribute("data-clipdelask")){
    const id=t.getAttribute("data-clipdelask");
    state.clipDel = state.clipDel===id ? null : id;
    state.clipOpen = id; renderMain(); return;
  }
  if(t.hasAttribute("data-clipdelcancel")){
    state.clipDel=null; renderMain(); return;
  }
  if(t.hasAttribute("data-clipdel")){
    const id=t.getAttribute("data-clipdel");
    const c=catById(id);
    state.clipDel=null;
    if(!c||c.id===CAT_DEFAULT){ renderMain(); return; }
    catById(CAT_DEFAULT).items.push(...c.items.filter(k=>catById(CAT_DEFAULT).items.indexOf(k)<0));
    SRCH.cats=SRCH.cats.filter(x=>x.id!==id);
    state.clipOpen=CAT_DEFAULT; saveCats(); renderMain(); return;
  }

  if(t.id==="clipClear"||t.hasAttribute("data-clipclear")){
    const scope=t.getAttribute("data-clipclear");
    if(scope==="all"){ SRCH.cats.forEach(c=>c.items=[]); }
    else { catById(scope||state.clipOpen||CAT_DEFAULT).items=[]; }
    saveCats(); renderMain(); return;
  }

  if(t.dataset.clipx){
    removeKey(t.dataset.clipx);
    saveCats(); renderMain(); return;
  }

  if(t.dataset.exp){
    SRCH.q=t.dataset.exp; SRCH.groups=null; SRCH.page=1; renderMain(); return;
  }

  if(t.dataset.fmt){
    const box=$("#clipBib");
    if(!box) return;
    const cat=catById(t.getAttribute("data-cat")||state.clipOpen||CAT_DEFAULT);
    const docs=cat.items.map(k=>LIB.find(x=>x.key===k)||ONLINE_DOCS.get(k)).filter(Boolean);
    const fmt=t.dataset.fmt;
    const text=fmt==="bibtex"?docs.map(bibtexOf).join("\n\n")
             :fmt==="ris"?docs.map(risOf).join("\n\n")
             :docs.map(citeText).join("\n");
    const tip=fmt==="bibtex"
        ?"存成 <code>.bib</code> 后在 Zotero / EndNote / JabRef 里选「导入」；提醒一句，et al. 写成 and others 是 BibTeX 的规范写法。"
      :fmt==="ris"
        ?"存成 <code>.ris</code> 后双击即可导入 EndNote / NoteExpress / Zotero。"
        :"直接粘进 Word 的参考文献表。卷期页请对照原文再核一遍。";
    box.innerHTML=`<pre class="bib">${esc(text)}</pre>`
      +`<div class="hint" style="margin-top:6px">共 ${docs.length} 条。点一下文本框即全选。${tip}</div>`;
    const pre=box.querySelector("pre");
    if(pre) pre.onclick=()=>{
      const r=document.createRange(); r.selectNodeContents(pre);
      const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    };
  }
});
/* 分类之间搬动：<select data-mv> 走 change，不走 click */
document.addEventListener("change",e=>{
  const s=e.target;
  if(!s||!s.getAttribute) return;
  const k=s.getAttribute("data-mv");
  if(!k) return;
  const to=s.value;
  removeKey(k);
  catById(to).items.push(k);
  saveCats(); renderMain();
});

const pageScroll={};
function goto(k,fromHistory=false){
  if(!STEPS[k])return;
  BackgroundTasks.foreground(1200);
  pageScroll[state.step]=$("#main").scrollTop;
  if(state.step==='assist'&&k!=='assist')ResearchUI.leave();
  state.step=k;
  if(!fromHistory&&location.hash!=='#'+k)history.pushState({step:k},'',location.pathname+location.search+'#'+k);
  FinalUI.closeMobileNav();
  $("#navList").querySelectorAll("[data-jump]").forEach(item=>{
    const active=item.dataset.jump===state.step;
    item.classList.toggle("on",active);
    if(active)item.setAttribute("aria-current","page");
    else item.removeAttribute("aria-current");
  });
  renderMain();
  if(k==='search'&&SRCH.scope==='mine')MyPapers.load();
}
window.addEventListener('popstate',()=>goto(location.hash.slice(1)||'search',true));

function bindMain(){
  $("#main").querySelectorAll("[data-jump]").forEach(el=>{
    el.onclick=()=>goto(el.dataset.jump);
  });
  $("#main").querySelectorAll("[data-open]").forEach(el=>{
    el.onclick=()=>openEvidence(el.dataset.open);
  });

  bindSearch();
  if(state.step==='search'){LibraryUI.bind();MyPapers.bind();runCatalogSearch();}
  if(state.step==='lab'||state.step==='math')SimulationUI.bind();
  else if(state.step==='anatomy')AnatomyUI.bind();
  else if(state.step==='pdf')PdfUI.bind();
  else if(state.step!=="search" && typeof ResearchUI!=="undefined")ResearchUI.bind();
}

/* 检索视图的控件绑定。注意 renderMain 会重建 DOM，所以每次渲染后必须重绑。 */
function bindSearch(){
  // ---- 对话检索 ----
  const aiIn=$("#aiInput"), aiGo=$("#aiGo"), aiRe=$("#aiReset");
  const qin=$("#qaInput");

  const runAI=()=>{
    if(!aiIn) return;
    const txt=(aiIn.value||"").trim();
    if(!txt) return;
    CHAT.last=txt;
    CHAT.intent=AIQ.aiParse(txt, CHAT.intent);
    renderMain();
    const box=$("#aiInput");
    if(box){
      box.focus();
      try{ box.setSelectionRange(box.value.length, box.value.length); }catch(e){}
    }
  };
  if(aiGo) aiGo.onclick=()=>{runAI();applyIntent();};
  if(aiIn) aiIn.onkeydown=e=>{ if(e.key==="Enter"&&!e.isComposing&&e.keyCode!==229){ e.preventDefault(); runAI();applyIntent(); } };
  // 示例问句：点一下填进输入框并直接解析，省得用户猜这个框能听懂什么
  document.querySelectorAll("[data-aiq]").forEach(b=>{
    b.onclick=()=>{ if(aiIn) aiIn.value=b.dataset.aiq; runAI(); };
  });
  const sqBtn=$("#sqBtn"), sqHelp=$("#sqHelp");
  if(sqBtn && sqHelp) sqBtn.onclick=()=>{ sqHelp.hidden=!sqHelp.hidden; };
  if(aiRe) aiRe.onclick=()=>{
    CHAT.intent=null; CHAT.last="";
    SRCH.groups=null; SRCH.yearFrom=0;
    Object.assign(SRCH,{oa:false,onlyV:false,hasAbs:false,zhOnly:false,sort:"rel",page:1});
    renderMain();
  };
  document.querySelectorAll("[data-ai]").forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.ai;
      if(k==="apply"){ applyIntent(); return; }
      if(k==="pm"){
        if(!CHAT.intent) return;
        const t=AIQ.aiPubmed(CHAT.intent);
        const ok=copyText(t);
        const box=$("#aiStr");
        if(box){
          box.innerHTML=`<code>${esc(t||"—")}</code>`;
          if(ok) box.style.background="var(--accent-soft)";
        }
      }
    };
  });
  document.querySelectorAll("[data-drop]").forEach(b=>{
    b.onclick=()=>{
      const v=b.dataset.drop, it=CHAT.intent;
      if(!it) return;
      it.concepts=(it.concepts||[]).filter(c=>c.c!==v);
      it.free=(it.free||[]).filter(w=>w!==v);
      renderMain();
    };
  });

  // ---- 列表语言 ----
  document.querySelectorAll("[data-ll]").forEach(b=>{
    b.onclick=()=>{ LISTLANG=b.dataset.ll; renderMain(); };
  });
  const fz=$("#fZh");
  if(fz) fz.onchange=()=>{ SRCH.zhOnly=fz.checked; SRCH.page=1; renderMain(); };

  const inp=$("#qInput");
  if(inp){
    inp.searchCompositionEvents?.abort();
    const compositionEvents=new AbortController();
    inp.searchCompositionEvents=compositionEvents;
    let timer=null,serverTimer=null;
    let composing=false;
    const update=(submitted=false)=>{
      if(composing||!inp.isConnected)return;
      SRCH.q=inp.value; SRCH.page=1; SRCH.groups=null; CHAT.intent=null;
      if(submitted){rememberSearch();refreshSearchHistory();}
      const replacement=document.createElement("div");replacement.innerHTML=renderSearch();
      const fresh=replacement.querySelector(".sbody"),old=document.querySelector(".sbody");
      if(old&&fresh){old.replaceWith(fresh);bindSearch();LibraryUI.bind();MyPapers.bind();FinalUI.bind();SiteUI.afterRender();clearTimeout(serverTimer);serverTimer=setTimeout(runCatalogSearch,submitted?0:450);return;}
      const position=inp.selectionStart;
      renderMain();
      const box=$("#qInput");if(box){box.focus();box.setSelectionRange(position,position);}
      clearTimeout(serverTimer);serverTimer=setTimeout(runCatalogSearch,submitted?0:450);
    };
    inp.addEventListener('compositionstart',()=>{composing=true;inp.dataset.composing='true';clearTimeout(timer);},{signal:compositionEvents.signal});
    inp.addEventListener('compositionend',()=>{composing=false;delete inp.dataset.composing;clearTimeout(timer);timer=setTimeout(update,220);},{signal:compositionEvents.signal});
    inp.oninput=ev=>{
      SRCH.q=inp.value;SRCH.groups=null;CHAT.intent=null;
      if(!composing&&!ev.isComposing){clearTimeout(timer);timer=setTimeout(update,220);}
    };
    inp.onkeydown=e=>{
      if(e.key==="Enter"&&!composing&&!e.isComposing&&e.keyCode!==229){ e.preventDefault();clearTimeout(timer);update(true); }
    };
  }
  document.querySelectorAll('[data-online-source]').forEach(button=>button.onclick=()=>{
    SRCH.source=button.dataset.onlineSource;
    if(SRCH.source==='online'&&!SRCH.onlineRecords.length)runOnlineSearch('*');else{renderMain();if(SRCH.source==='local')runCatalogSearch();}
  });
  document.querySelectorAll('[data-online-page]').forEach(button=>button.onclick=()=>{
    if(button.dataset.onlinePage==='next'&&SRCH.onlineNext){SRCH.onlineStack.push(SRCH.onlineNext);runOnlineSearch(SRCH.onlineNext);}
    else if(button.dataset.onlinePage==='previous'&&SRCH.onlineStack.length>1){SRCH.onlineStack.pop();runOnlineSearch(SRCH.onlineStack.at(-1));}
  });
  const go=$("#qGo");
  if(go) go.onclick=()=>{ SRCH.q=$("#qInput").value; SRCH.page=1;SRCH.source='local';SRCH.onlineRecords=[];rememberSearch();renderMain();runCatalogSearch(); };

  bindSearchHistory();
  const quickYearFrom=$('#quickYearFrom'),quickYearTo=$('#quickYearTo');
  const applyQuickYears=()=>{SRCH.yearFrom=Number(quickYearFrom?.value)||0;SRCH.yearTo=Number(quickYearTo?.value)||0;SRCH.page=1;renderMain();rerunSearch();};
  quickYearFrom?.addEventListener('change',applyQuickYears);quickYearTo?.addEventListener('change',applyQuickYears);
  document.querySelectorAll('[data-year-preset]').forEach(button=>button.onclick=()=>{const count=Number(button.dataset.yearPreset);SRCH.yearFrom=count?new Date().getFullYear()-count+1:0;SRCH.yearTo=0;SRCH.years=[];SRCH.page=1;renderMain();rerunSearch();});
  const quickSort=$('#qSortQuick');if(quickSort)quickSort.onchange=()=>{SRCH.sort=quickSort.value;SRCH.page=1;renderMain();rerunSearch();};

  const reset=$("#qClear");
  if(reset) reset.onclick=()=>{
    Object.assign(SRCH,{q:"",field:"all",years:[],topics:[],journals:[],oa:false,onlyV:false,hasAbs:false,zhOnly:false,groups:null,yearFrom:0,yearTo:0,sort:"rel",page:1});
    CHAT.intent=null; CHAT.last="";
    CATALOG_SEARCH.active=false;CATALOG_SEARCH.error='';CATALOG_SEARCH.signature='';renderMain();
  };

  const fld=$("#qField");
  if(fld) fld.onchange=()=>{ SRCH.field=fld.value; SRCH.page=1; renderMain();if(CATALOG_SEARCH.active)runCatalogSearch(); };

  const srt=$("#qSort");
  if(srt) srt.onchange=()=>{ SRCH.sort=srt.value; SRCH.page=1; renderMain();rerunSearch(); };

  document.querySelectorAll("[data-datebasis]").forEach(c=>{c.onchange=()=>{SRCH.dateBasis=c.dataset.datebasis;SRCH.years=[];SRCH.page=1;renderMain();};});
  document.querySelectorAll("[data-fy]").forEach(c=>{
    c.onchange=()=>{
      const i=SRCH.years.indexOf(c.dataset.fy);
      if(c.checked){ if(i<0) SRCH.years.push(c.dataset.fy); }
      else if(i>=0) SRCH.years.splice(i,1);
      SRCH.page=1; renderMain();if(CATALOG_SEARCH.active)runCatalogSearch();
    };
  });

  document.querySelectorAll("[data-ft]").forEach(c=>{
    c.onchange=()=>{
      const i=SRCH.topics.indexOf(c.dataset.ft);
      if(c.checked){ if(i<0) SRCH.topics.push(c.dataset.ft); }
      else if(i>=0) SRCH.topics.splice(i,1);
      SRCH.page=1; renderMain();if(CATALOG_SEARCH.active)runCatalogSearch();
    };
  });

  const onlyV=$("#fOnlyV");
  if(onlyV) onlyV.onchange=()=>{ SRCH.onlyV=onlyV.checked; SRCH.page=1; renderMain(); };

  const oa=$("#fOA");
  if(oa) oa.onchange=()=>{ SRCH.oa=oa.checked; SRCH.page=1; renderMain(); };

  const hasAbs=$("#fAbs");
  if(hasAbs) hasAbs.onchange=()=>{ SRCH.hasAbs=hasAbs.checked; SRCH.page=1; renderMain(); };

  document.querySelectorAll("[data-page]").forEach(b=>{
    b.onclick=()=>{
      const n=parseInt(b.dataset.page,10);
      if(!isNaN(n)){ SRCH.page=n; renderMain();if(CATALOG_SEARCH.active)runCatalogSearch(); }
    };
  });

  const pageJump=$("#searchPageJump");
  if(pageJump) pageJump.onsubmit=event=>{
    event.preventDefault();
    SRCH.page=Number($("#searchPageNumber").value);
    renderMain();if(CATALOG_SEARCH.active)runCatalogSearch();
  };

  document.querySelectorAll("[data-rec]").forEach(el=>{
    el.onclick=()=>openRec(el.dataset.rec);
  });

  document.querySelectorAll("[data-preset]").forEach(b=>{
    b.onclick=()=>{ SRCH.q=b.dataset.preset; SRCH.page=1;rememberSearch();renderMain();runCatalogSearch(); };
  });

  document.querySelectorAll("[data-fj]").forEach(c=>{
    c.onchange=()=>{
      const i=SRCH.journals.indexOf(c.dataset.fj);
      if(c.checked){ if(i<0) SRCH.journals.push(c.dataset.fj); }
      else if(i>=0) SRCH.journals.splice(i,1);
      SRCH.page=1; renderMain();
    };
  });

}

/* 主题图标跟着实际状态走，而不是常年一个月亮 */
const syncThemeIcon=()=>{
  const dark=document.documentElement.dataset.theme==="dark";
  const u=$("#themeBtn use");
  if(u) u.setAttribute("href", dark?"#i-sun":"#i-moon");
};
$("#themeBtn").onclick=()=>{
  const cur=document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = cur==="light" ? "dark" : "light";
  syncThemeIcon();
};
syncThemeIcon();

document.addEventListener("keydown",e=>{
  if(e.key==="Escape") evShut();
});

async function startWebsite(){
  if(!$('#main').children.length)$('#main').innerHTML='<div class="site-load" role="status">正在准备文献检索…</div>';
  try{
    renderNav();
    const query=new URLSearchParams(location.search);
    const bootstrap=await LibraryUI.first();
    const entryQuery=query.get('q');if(entryQuery)SRCH.q=entryQuery;
    renderNav();renderMain();
    if(query.get('paper'))ReaderUI.open(query.get('paper'));
    WebAccount.init(bootstrap.session);PdfUI.globalDrop();
    setTimeout(()=>{LibraryUI.rest();AnatomyLoader.prefetch();},0);
  }catch(error){const box=document.createElement('section');box.className='site-service-notice';box.setAttribute('role','status');box.innerHTML='<strong>在线数据暂未连接</strong><p>'+esc(error.message)+'</p><button class="btn" onclick="location.reload()">重试连接</button> <a class="btn ghost" href="/demo/">打开离线演示版</a>';$('#main').prepend(box);}
}
startWebsite();
